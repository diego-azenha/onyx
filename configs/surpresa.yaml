# Detector de surpresa acumulada (knowledge/frentes/surpresa-acumulada/README.md).
# ÚNICA fonte de números do pacote `surpresa`. CONGELADO em 2026-09-29 antes da primeira medição do S1
# (knowledge/frentes/surpresa-acumulada/S1-detector-sozinho.md): toda mudança depois disso é seleção
# e tem de ser registrada na ficha do experimento que a motivou.

ar_p: 10                       # ordem do AR de branqueamento (a mesma do Onyx, h0.ar_order)

garch:                         # fluxo B: GARCH(1,1) com variance targeting em sigma_barra^2
  alphas: [0.0, 0.03, 0.06, 0.10, 0.15]
  persistencias: [0.80, 0.90, 0.95, 0.98]   # alpha+beta; alpha=0 => variância constante

pit:
  cauda_q: 0.025               # além dos quantis q e 1-q do histórico, cauda exponencial (GPD shape 0)

alternativas:                  # log-razão de verossimilhança exata contra g ~ N(0,1)
  escala_sobe: [1.2, 1.5, 2.0] # fluxo A: desvio-padrão multiplicado por s
  escala_desce: [0.8, 0.65]
  cauda_nu: [4.0, 8.0]         # fluxo A: t de Student de variância unitária
  forma_theta: 0.15            # fluxo A: densidade de PIT 1 +/- theta * Legendre_k normalizado, k=3,4
  media_delta: [0.25, 0.5, 1.0]  # fluxo B, os dois sinais
  correlacao_rho: [0.15, 0.30]   # fluxo B, os dois sinais
  arch_a: [0.2, 0.4]           # fluxo B: h_t = max(h_min, 1 + a (g_{t-1}^2 - 1))
  arch_h_min: 0.05

calibracao:                    # sr_cal: viés por direção medido fora da amostra no próprio histórico
  frac_ajuste: 0.6667          # ajusta nos primeiros 2/3, mede o viés no 1/3 final
  min_holdout: 200             # abaixo disso não calibra (viés = 0, eta = 1)
  lote: 25                     # batch means para a variância de longo prazo dos incrementos
  eta_min: 0.1                 # piso da têmpera da razão de verossimilhança
  js_k: 1.0                    # encolhimento James-Stein do viés: fator max(0, 1 - js_k * EP^2 / vies^2)

quadratura_nos: 60             # Gauss-Hermite para E_H0[incremento] (valor teórico -KL)
